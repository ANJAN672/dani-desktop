name: DANI core verification

on:
  pull_request:
    paths:
      - 'server/runtime/**'
      - 'server/proactive/**'
      - '.github/workflows/dani-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Native runtime and proactive unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run native runtime and proactive regression tests
        run: >-
          pnpm exec vitest run
          server/runtime/native-loop.test.ts
          server/proactive/goal-ledger.test.ts
          server/proactive/autopilot.test.ts
          server/proactive/native-executor.test.ts
      - name: Typecheck server implementation
        run: pnpm exec tsc -p tsconfig.server.json --noEmit
