# Native desktop release builds. Each package is built on the OS it runs on,
# then collected into one draft release for human review.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag, or branch to release (defaults to the selected branch)"
        required: false
        type: string
  push:
    branches:
      - main
      - prod
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes an older build. Tags and manual
  # runs use their own refs, so they do not cancel branch releases.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Pin release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          release_tag="v$version"

          # Branch pushes release the exact commit that caused the run. Only a
          # tag-triggered run has a tag whose name must match package.json.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$sha" = "$GITHUB_SHA" || {
              echo "::error::checkout $sha does not match triggering commit $GITHUB_SHA"
              exit 1
            }
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/$release_tag" || {
              echo "::error::tag must be $release_tag to match package.json"
              exit 1
            }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 (AppImage + deb)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Linux
        run: node scripts/prepare-cloudflared.mjs --target linux-x64
      - name: Build Linux packages
        run: pnpm package:linux
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-x86_64.AppImage
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-amd64.deb
          test -f release/latest-linux.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x86_64.AppImage" release/DaniBot.AppImage
          cp "release/DaniBot-$version-amd64.deb" release/danibot-amd64.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/DaniBot-*.AppImage
            release/DaniBot-*.deb
            release/danibot-amd64.deb
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 (NSIS)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for Windows
        run: node scripts/prepare-cloudflared.mjs --target win32-x64
      - name: Build Windows packages
        run: pnpm package:win
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release/DaniBot-${{ needs.prepare.outputs.version }}-setup.exe
          test -f release/latest.yml
      - name: Create stable download name
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-setup.exe" release/DaniBot-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/DaniBot-*.exe
            release/DaniBot-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64 + Intel (dmg + zip)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # No Apple Developer ID is configured yet. electron-builder may apply an
      # ad-hoc signature, but these builds are not Developer ID signed or notarized.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage pinned cloudflared for both Mac architectures
        run: >-
          node scripts/prepare-cloudflared.mjs
          --target darwin-arm64
          --target darwin-x64
      - name: Build macOS packages
        run: pnpm package:mac
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          for arch in arm64 x64; do
            test -f "release/DaniBot-$version-$arch.dmg"
            test -f "release/DaniBot-$version-$arch.zip"
          done
          test -f release/latest-mac.yml
      - name: Create stable download names
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.prepare.outputs.version }}
          cp "release/DaniBot-$version-x64.dmg" release/DaniBot-Intel.dmg
          cp "release/DaniBot-$version-arm64.dmg" release/DaniBot-Silicon.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            release/DaniBot-*.dmg
            release/DaniBot-*.dmg.blockmap
            release/DaniBot-*.zip
            release/DaniBot-*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify complete artifact set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "DaniBot-$VERSION-x86_64.AppImage"
            "DaniBot-$VERSION-amd64.deb"
            "DaniBot-$VERSION-setup.exe"
            "DaniBot-$VERSION-x64.zip"
            "DaniBot-$VERSION-arm64.dmg"
            "DaniBot-$VERSION-arm64.zip"
            "DaniBot-$VERSION-x64.dmg"
            DaniBot.AppImage
            danibot-amd64.deb
            DaniBot-setup.exe
            DaniBot-Intel.dmg
            DaniBot-Silicon.dmg
            latest-linux.yml latest.yml latest-mac.yml
          )
          for file in "${required[@]}"; do
            test -s "release-assets/$file" || {
              echo "::error::missing release asset: $file"
              exit 1
            }
          done
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Dani Bot $VERSION

          Native desktop packages built from commit \`$SHA\`:

          - Linux x64: AppImage and Debian package
          - Windows x64: NSIS setup executable
          - macOS: dmg and zip for Apple silicon and Intel
          - Auto-update metadata: \`latest-linux.yml\`, \`latest.yml\`, and \`latest-mac.yml\`

          ### Signing status

          These are pre-signing builds. Windows is unsigned and may show a SmartScreen warning. macOS has hardened runtime enabled but is not signed with an Apple Developer ID and is not notarized; Gatekeeper may block it. Apple Developer ID credentials and notarization must be added before a public production release.

          ### Validation

          The packages were built by electron-builder on native GitHub-hosted Linux, Windows, and macOS runners. The workflow verified that every expected installer and updater metadata file exists. Keep this release as a draft until the installers have been tested on clean machines.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            test "$is_draft" = true || {
              echo "::error::$tag is already published; refusing to overwrite it"
              exit 1
            }
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --title "Dani Bot $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --draft --title "Dani Bot $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Upload one unique basename at a time. A single wildcard request can
          # fail after partially succeeding, which makes a rerun ambiguous.
          # Per-file clobber plus bounded retries makes this step idempotent.
          declare -A uploaded=()
          find release-assets -maxdepth 1 -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' asset; do
                name=$(basename "$asset")
                if [[ -n "${uploaded[$name]:-}" ]]; then
                  echo "::error::duplicate release asset basename: $name"
                  exit 1
                fi
                uploaded[$name]=1
                for attempt in 1 2 3; do
                  if gh release upload "$tag" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --clobber; then
                    break
                  fi
                  if [[ "$attempt" == 3 ]]; then
                    echo "::error::failed to upload $name after $attempt attempts"
                    exit 1
                  fi
                  echo "retrying $name after upload attempt $attempt"
                  sleep $((attempt * 5))
                done
              done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true
